
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waleed Player</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0d1018;color:#fff;
 font-family:Arial,sans-serif;padding:20px;
}
header{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:20px;
}
h1{font-size:22px}
button,input,select{font:inherit}
button{
 background:#20283a;color:white;border:1px solid #34415a;
 padding:11px;border-radius:10px;cursor:pointer;
}
button:hover{border-color:#718cff}
.layout{
 display:grid;grid-template-columns:1fr 300px;
 gap:18px;max-width:1300px;margin:auto;
}
.player,.panel{
 background:#171d29;border:1px solid #2a3447;
 border-radius:16px;overflow:hidden;padding:15px;
}
.screen{
 background:#000;aspect-ratio:16/9;
 display:flex;align-items:center;justify-content:center;
 position:relative;
}
video{width:100%;height:100%;object-fit:contain}
.empty{
 position:absolute;text-align:center;color:#aaa;
 pointer-events:none;
}
.info{padding:15px 0}
#title{font-size:17px;font-weight:bold}
#seek{width:100%;accent-color:#718cff}
.controls{
 display:flex;justify-content:space-between;
 gap:8px;flex-wrap:wrap;margin-top:12px;
}
.group{display:flex;gap:6px;align-items:center}
.play{background:#637fff}
input[type=range]{accent-color:#718cff}
.panel h3{margin-top:0}
.add{
 width:100%;margin:5px 0;
 background:#253047;
}
.url{
 display:flex;gap:5px;margin-top:12px;
}
.url input{
 width:100%;min-width:0;
 background:#101722;color:white;
 border:1px solid #34415a;padding:10px;
 border-radius:9px;
}
.item{
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;
 background:#222c3e;padding:10px;
 margin:8px 0;border-radius:10px;
 cursor:pointer;font-size:13px;
}
.item.active{border:1px solid #718cff}
.item span{overflow:hidden;text-overflow:ellipsis}
small{color:#aaa}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 body{padding:10px}
}
</style>
</head>
<body>

<header>
 <h1>▶ Waleed Player</h1>
 <button id="theme">☀ / ☾</button>
</header>

<div class="layout">

 <main class="player">

  <div class="screen">
   <video id="video" playsinline></video>
   <div class="empty" id="empty">
    <h2>▶</h2>
    <p>اختر فيديو لبدء المشاهدة</p>
   </div>
  </div>

  <div class="info">
   <div id="title">لم يتم اختيار فيديو</div>
   <small id="details">Waleed Video Player</small>
  </div>

  <input type="range" id="seek"
   min="0" max="1000" value="0">

  <div class="controls">

   <div class="group">
    <button id="back">↶ 10</button>
    <button class="play" id="play">▶</button>
    <button id="forward">10 ↷</button>
   </div>

   <div class="group">
    <input id="volume" type="range"
     min="0" max="1" step="0.01" value="1"
     style="width:75px">

    <select id="speed">
     <option value=".5">0.5x</option>
     <option value=".75">0.75x</option>
     <option value="1" selected>1x</option>
     <option value="1.25">1.25x</option>
     <option value="1.5">1.5x</option>
     <option value="2">2x</option>
    </select>

    <button id="pip">▣</button>
    <button id="fullscreen">⛶</button>
   </div>

  </div>

  <p style="color:#aaa;font-size:12px">
   <span id="current">00:00</span>
   /
   <span id="duration">00:00</span>
  </p>

 </main>

 <aside>

  <section class="panel">
   <h3>إضافة فيديو</h3>

   <button class="add" id="choose">
    📁 اختيار فيديو من الجهاز
   </button>

   <input type="file" id="files"
    accept="video/*" multiple hidden>

   <div class="url">
    <input id="url" placeholder="رابط فيديو مباشر">
    <button id="addUrl">إضافة</button>
   </div>
  </section>

  <section class="panel" style="margin-top:15px">
   <h3>قائمة التشغيل</h3>
   <div id="list">
    <small>لا توجد فيديوهات</small>
   </div>
   <button id="clear" style="width:100%">
    مسح القائمة
   </button>
  </section>

 </aside>

</div>

<script>
const video=document.getElementById("video");
const files=document.getElementById("files");
const list=document.getElementById("list");

let videos=[];
let current=-1;

function time(s){
 if(!Number.isFinite(s))return "00:00";
 let m=Math.floor(s/60);
 let sec=Math.floor(s%60);
 return String(m).padStart(2,"0")+":"+
 String(sec).padStart(2,"0");
}

function addVideo(name,src,type){
 videos.push({name,src,type});
 render();
 if(current===-1) load(0);
}

function load(index){
 if(index<0||index>=videos.length)return;
 current=index;
 video.src=videos[index].src;
 video.load();
 document.getElementById("empty").style.display="none";
 document.getElementById("title").textContent=
 videos[index].name;
 render();
}

function render(){
 list.innerHTML="";
 videos.forEach((v,i)=>{
  let row=document.createElement("div");
  row.className="item"+(i===current?" active":"");

  let name=document.createElement("span");
  name.textContent="▶ "+v.name;
  name.onclick=()=>load(i);

  let del=document.createElement("button");
  del.textContent="×";
  del.onclick=()=>{
   if(v.type==="file")URL.revokeObjectURL(v.src);
   videos.splice(i,1);
   if(i===current){
    video.pause();
    current=-1;
    if(videos.length)load(Math.min(i,videos.length-1));
    else{
     video.removeAttribute("src");
     document.getElementById("empty").style.display="flex";
     document.getElementById("title").textContent="لم يتم اختيار فيديو";
    }
   }else if(i<current)current--;
   render();
  };

  row.append(name,del);
  list.append(row);
 });
 if(!videos.length)list.innerHTML="<small>لا توجد فيديوهات</small>";
}

document.getElementById("choose").onclick=()=>files.click();

files.onchange=()=>{
 [...files.files].forEach(file=>{
  if(file.type.startsWith("video/")){
   addVideo(file.name,URL.createObjectURL(file),"file");
  }
 });
 files.value="";
};

document.getElementById("addUrl").onclick=()=>{
 let url=document.getElementById("url").value.trim();
 try{
  let u=new URL(url);
  if(!["http:","https:"].includes(u.protocol))throw 0;
  addVideo(u.pathname.split("/").pop()||"فيديو من الإنترنت",u.href,"url");
  document.getElementById("url").value="";
 }catch(e){
  alert("الرابط غير صالح");
 }
};

document.getElementById("play").onclick=()=>{
 if(!video.src)return;
 if(video.paused)video.play();
 else video.pause();
};

video.onplay=()=>document.getElementById("play").textContent="Ⅱ";
video.onpause=()=>document.getElementById("play").textContent="▶";

document.getElementById("back").onclick=()=>{
 video.currentTime=Math.max(0,video.currentTime-10);
};

document.getElementById("forward").onclick=()=>{
 video.currentTime=Math.min(video.duration,video.currentTime+10);
};

document.getElementById("volume").oninput=e=>{
 video.volume=Number(e.target.value);
};

document.getElementById("speed").onchange=e=>{
 video.playbackRate=Number(e.target.value);
};

document.getElementById("seek").oninput=e=>{
 if(video.duration)
 video.currentTime=e.target.value/1000*video.duration;
};

video.ontimeupdate=()=>{
 if(video.duration){
  document.getElementById("seek").value=
  video.currentTime/video.duration*1000;
 }
 document.getElementById("current").textContent=time(video.currentTime);
};

video.onloadedmetadata=()=>{
 document.getElementById("duration").textContent=time(video.duration);
};

document.getElementById("fullscreen").onclick=()=>{
 const screen=document.querySelector(".screen");
 if(document.fullscreenElement)
 document.exitFullscreen();
 else screen.requestFullscreen();
};

document.getElementById("pip").onclick=async()=>{
 try{
  if(document.pictureInPictureElement)
  await document.exitPictureInPicture();
  else await video.requestPictureInPicture();
 }catch(e){alert("الميزة غير مدعومة")}
};

document.getElementById("clear").onclick=()=>{
 videos.forEach(v=>{
  if(v.type==="file")URL.revokeObjectURL(v.src);
 });
 videos=[];
 current=-1;
 video.pause();
 video.removeAttribute("src");
 document.getElementById("empty").style.display="flex";
 document.getElementById("title").textContent="لم يتم اختيار فيديو";
 render();
};

document.getElementById("theme").onclick=()=>{
 document.body.classList.toggle("light");
 document.body.style.background=
 document.body.classList.contains("light")?"#eef1f8":"#0d1018";
 document.body.style.color=
 document.body.classList.contains("light")?"#172033":"white";
};

document.addEventListener("keydown",e=>{
 if(["INPUT","SELECT"].includes(document.activeElement.tagName))return;
 if(e.code==="Space"){e.preventDefault();document.getElementById("play").click()}
 if(e.key==="ArrowRight")video.currentTime=Math.max(0,video.currentTime-5);
 if(e.key==="ArrowLeft")video.currentTime+=5;
 if(e.key.toLowerCase()==="f")document.getElementById("fullscreen").click();
});
</script>

</body>
</html>
